name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  go-test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go test
        run: go test ./... -count=1 -timeout 5m

  go-quality:
    name: Vet, format, and race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: go mod download
        run: go mod download

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test ./... -race -count=1 -timeout 5m

  conformance:
    name: Real-server conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: go mod download
        run: go mod download

      - name: Run real-server conformance suite
        shell: bash
        run: go test -v ./conformance -count=1 -timeout 2m 2>&1 | tee conformance-summary.txt

      - name: Upload conformance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcis-go-conformance-${{ github.sha }}
          path: conformance-summary.txt
          retention-days: 14

  data-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Guards against arcis-go's vendored shared data drifting from the
    # monorepo's authoritative copies. arcis-go lives in a separate repo, so
    # the monorepo's own data-sync-check can't reach it -- this is the
    # cross-repo half. Three files must stay byte-identical to
    # getarcis/arcis main:
    #   spec/TEST_VECTORS.json            <- spec/TEST_VECTORS.json
    #   sanitizers/data/patterns.json     <- packages/core/patterns.json
    #   middleware/data/bot_patterns.json <- packages/core/bot-patterns.json
    # Without this, an upstream data edit that isn't mirrored here makes the
    # parity / detector tests silently pass against stale data -- exactly how
    # the bundled patterns.json + bot corpus drifted unnoticed before.
    steps:
      - uses: actions/checkout@v4

      - name: Compare shared data files against getarcis/arcis main
        run: |
          base="https://raw.githubusercontent.com/getarcis/arcis/main"
          rc=0
          check() {
            local local_path="$1" upstream_path="$2"
            if ! curl -fsSL "$base/$upstream_path" -o /tmp/upstream.json; then
              echo "::error::could not fetch $upstream_path from getarcis/arcis main"
              rc=1
              return
            fi
            local local_sha upstream_sha
            local_sha=$(sha256sum "$local_path" | awk '{print $1}')
            upstream_sha=$(sha256sum /tmp/upstream.json | awk '{print $1}')
            echo "$local_path"
            echo "  local:    $local_sha"
            echo "  upstream: $upstream_sha"
            if [ "$local_sha" != "$upstream_sha" ]; then
              echo "::error::$local_path has drifted from getarcis/arcis main ($upstream_path)."
              echo "Run: cp ../arcis/$upstream_path $local_path"
              rc=1
            fi
          }
          check spec/TEST_VECTORS.json spec/TEST_VECTORS.json
          check sanitizers/data/patterns.json packages/core/patterns.json
          check middleware/data/bot_patterns.json packages/core/bot-patterns.json
          exit $rc
